name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust stable and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test workspace
        run: cargo +stable test --workspace --locked
      - name: Check Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Rustdoc
        run: cargo +stable doc --workspace --no-deps --locked
      - name: Test support helpers
        run: python3 -m unittest discover -s scripts/tests
      - name: Install Markdown checker dependencies
        run: |
          python3 -m venv scratch/markdown-preview/venv
          scratch/markdown-preview/venv/bin/pip install -r scripts/markdown-preview-requirements.txt
      - name: Check Markdown links
        run: scratch/markdown-preview/venv/bin/python scripts/preview-docs.py --check

  msrv:
    name: Rust 1.85 minimum version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install minimum Rust version
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace and test compilation
        run: cargo +1.85.0 check --workspace --all-targets --locked
