[workspace]
members = ["crates/ciq-prg", "crates/ciq-mc", "crates/ciq-dis", "crates/ciq-asm", "crates/ciq-sign", "crates/ciq-package", "crates/ciq-compiler", "crates/ciq-assembly"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ciq-assembly = { path = "crates/ciq-assembly" }
ciq-prg = { path = "crates/ciq-prg" }
ciq-mc = { path = "crates/ciq-mc" }
ciq-sign = { path = "crates/ciq-sign" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# RSA fixture generation is prohibitively slow with unoptimized big-integer arithmetic.
[profile.test.package.num-bigint-dig]
opt-level = 3
