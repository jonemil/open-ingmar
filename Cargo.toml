[workspace]
members = ["crates/ciq-prg", "crates/ciq-mc", "crates/ciq-dis", "crates/ciq-asm", "crates/ciq-sign", "crates/ciq-package", "crates/ciq-compiler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
ciq-prg = { path = "crates/ciq-prg" }
ciq-mc = { path = "crates/ciq-mc" }
ciq-sign = { path = "crates/ciq-sign" }

[workspace.lints.rust]
unsafe_code = "forbid"

# RSA fixture generation is prohibitively slow with unoptimized big-integer arithmetic.
[profile.test.package.num-bigint-dig]
opt-level = 3
